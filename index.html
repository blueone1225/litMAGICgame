<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>動作遊戲</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(#111, #222);
      color: white;
      font-family: sans-serif;
    }

    #gameContainer {
      position: relative;
      width: 800px;
      height: 400px;
      margin: 20px auto;
      background-color: #000;
      border: 2px solid #555;
      overflow: hidden;
    }

    #player {
      position: absolute;
      bottom: 0;
      left: 100px;
      width: 40px;
      height: 40px;
      background-color: yellow;
      transition: left 0.05s, bottom 0.05s;
      animation: glowFlash 1.2s infinite alternate;
    }

    @keyframes glowFlash {
      0% { box-shadow: 0 0 5px #ffff33; }
      100% { box-shadow: 0 0 20px 5px #ffff99; }
    }

    .invincible {
      animation: blink 0.2s steps(2, start) infinite;
    }

    @keyframes blink {
      to {
        visibility: hidden;
      }
    }

    .enemy {
      position: absolute;
      bottom: 0;
      width: 40px;
      height: 40px;
      background-color: red;
      animation: moveEnemy 6s linear infinite;
    }

    @keyframes moveEnemy {
      0% { left: 800px; }
      100% { left: -50px; }
    }

    #hpBarContainer {
      width: 300px;
      height: 20px;
      border: 2px solid #fff;
      background: #222;
      margin: 10px auto;
    }

    #hpBar {
      height: 100%;
      background: linear-gradient(to right, limegreen, green);
      width: 100%;
      transition: width 0.3s ease;
    }

    #info {
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="hpBarContainer">
    <div id="hpBar"></div>
  </div>

  <div id="gameContainer">
    <div id="player"></div>

    <!-- 你可以複製這整個 .enemy 來加更多怪 -->
    <div class="enemy" style="top: 200px;"></div>
    <div class="enemy" style="top: 300px; animation-delay: 3s;"></div>
  </div>

  <div id="info">使用 A/D 或 ←/→ 移動，Space/W/↑ 跳，Shift+方向 Dash 閃避</div>

  <script>
    const player = document.getElementById("player");
    const enemies = document.querySelectorAll(".enemy");
    const hpBar = document.getElementById("hpBar");

    let playerX = 100;
    let playerY = 0;
    let velocityY = 0;
    let jumping = false;
    let keys = {};
    let gravity = 1;
    let dashCooldown = false;
    let invincible = false;
    let maxHP = 100;
    let currentHP = 100;

    function movePlayer() {
      if ((keys["a"] || keys["ArrowLeft"]) && !keys["Shift"]) {
        playerX -= 5;
      }
      if ((keys["d"] || keys["ArrowRight"]) && !keys["Shift"]) {
        playerX += 5;
      }

      if ((keys["Shift"] && keys["a"]) || (keys["Shift"] && keys["ArrowLeft"])) {
        if (!dashCooldown) {
          playerX -= 100;
          dashCooldown = true;
          setTimeout(() => dashCooldown = false, 800);
        }
      }
      if ((keys["Shift"] && keys["d"]) || (keys["Shift"] && keys["ArrowRight"])) {
        if (!dashCooldown) {
          playerX += 100;
          dashCooldown = true;
          setTimeout(() => dashCooldown = false, 800);
        }
      }

      if ((keys[" "] || keys["w"] || keys["ArrowUp"]) && !jumping) {
        velocityY = 15;
        jumping = true;
      }

      velocityY -= gravity;
      playerY += velocityY;

      if (playerY <= 0) {
        playerY = 0;
        jumping = false;
      }

      playerX = Math.max(0, Math.min(760, playerX));
      player.style.left = playerX + "px";
      player.style.bottom = playerY + "px";

      checkCollision();
      requestAnimationFrame(movePlayer);
    }

    function checkCollision() {
      const playerRect = player.getBoundingClientRect();

      enemies.forEach(enemy => {
        const enemyRect = enemy.getBoundingClientRect();

        const overlap = !(
          playerRect.right < enemyRect.left ||
          playerRect.left > enemyRect.right ||
          playerRect.bottom < enemyRect.top ||
          playerRect.top > enemyRect.bottom
        );

        if (overlap && !invincible) {
          takeDamage(20);
        }
      });
    }

    function takeDamage(amount) {
      currentHP -= amount;
      if (currentHP < 0) currentHP = 0;
      hpBar.style.width = (currentHP / maxHP * 100) + "%";

      invincible = true;
      player.classList.add("invincible");
      setTimeout(() => {
        player.classList.remove("invincible");
        invincible = false;
      }, 1000);
    }

    document.addEventListener("keydown", (e) => keys[e.key] = true);
    document.addEventListener("keyup", (e) => keys[e.key] = false);

    movePlayer();
  </script>
</body>
</html>
