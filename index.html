<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學生性格分組</title>
  <style>
    body { font-family: 微軟正黑體; background: #f0fdf4; color: #1b5e20; padding: 20px; }
    h1 { color: #33691e; text-align: center; }
    .trait-box {
      border: 2px dashed #a5d6a7;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      background: #e8f5e9;
    }
    .trait-box h3 {
      margin-top: 0;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      background-color: #66bb6a;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      display: block;
      margin: 0 auto;
    }
    button:hover {
      background-color: #4caf50;
    }
    .group {
      border: 1px solid #c8e6c9;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      background: #ffffffb0;
    }
    #result {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
    }
    .group div {
      width: 100%;
      margin: 10px 0;
    }

    /* 響應式設計 */
    @media (min-width: 600px) {
      .group div {
        width: 45%;
      }
    }

    @media (min-width: 768px) {
      .group div {
        width: 30%;
      }
    }

    @media (min-width: 1024px) {
      .group div {
        width: 22%;
      }
    }
  </style>
</head>
<body>

<h1>🌳 學生性格分組系統</h1>
<button onclick="generateGroups()">開始分組</button>

<div class="trait-box">
  <h3>🧑‍🏫 可照顧別人</h3>
  <p id="careList"></p>
</div>

<div class="trait-box">
  <h3>🐢 內向型</h3>
  <p id="shyList"></p>
</div>

<div class="trait-box">
  <h3>🤝 中間值</h3>
  <p id="neutralList"></p>
</div>

<h2>📦 分組結果</h2>
<div id="result"></div>

<script>
  // 👇 資料分類
  const care = ["小芸", "阿傑", "怡君"];       // 可照顧別人
  const shy = ["子涵", "志偉", "靜儀", "冠宇"]; // 內向型
  const neutral = ["小瑜", "偉翔", "佩珊", "宏昌"]; // 中間型

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function distributeEvenly(list, groups) {
    list.forEach((person, i) => {
      groups[i % groups.length].push(person);
    });
  }

  function generateGroups() {
    // 打亂每個性格類別
    shuffle(care);
    shuffle(shy);
    shuffle(neutral);

    // 指定要幾組
    const groupCount = 3;
    const groups = Array.from({ length: groupCount }, () => []);

    // 平均分配每類性格進組別
    distributeEvenly(care, groups);
    distributeEvenly(shy, groups);
    distributeEvenly(neutral, groups);

    // 顯示各性格名單
    document.getElementById("careList").innerText = care.join("、");
    document.getElementById("shyList").innerText = shy.join("、");
    document.getElementById("neutralList").innerText = neutral.join("、");

    // 顯示分組結果
    const output = document.getElementById("result");
    output.innerHTML = '';
    groups.forEach((group, i) => {
      const div = document.createElement("div");
      div.className = "group";
      div.innerHTML = `<strong>第 ${i + 1} 組：</strong> ${group.join("、")}`;
      output.appendChild(div);
    });
  }
</script>

</body>
</html>
