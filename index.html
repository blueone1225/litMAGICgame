<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>終端機模擬器 - 自爆演示</title>
  <style>
    body {
      background: linear-gradient(to bottom, #0f0f0f, #1a1a1a);
      color: #00ff88;
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    #terminal {
      padding: 24px;
      white-space: pre-wrap;
      min-height: 100vh;
      box-sizing: border-box;
    }
    #input {
      display: inline;
      outline: none;
    }
    .blink {
      animation: blink 1s steps(2, start) infinite;
    }
    @keyframes blink {
      to {
        visibility: hidden;
      }
    }
    .destroying {
      color: red;
      animation: flicker 0.1s infinite;
    }
    @keyframes flicker {
      0%, 100% {opacity: 1;}
      50% {opacity: 0;}
    }
    .output {
      color: #00ff88;
    }
    .error {
      color: #ff6b6b;
    }
    .info {
      color: #ffd166;
    }
    .command {
      color: #29b6f6;
    }
    .header {
      background-color: #222;
      padding: 8px 16px;
      font-weight: bold;
      color: #ffffff;
      border-bottom: 2px solid #00ff88;
    }
  </style>
</head>
<body>
  <div class="header">模擬終端機 v2.0</div>
  <div id="terminal">
    <div><span class="command">$</span> <span id="input" contenteditable="true"></span><span class="blink">█</span></div>
  </div>

  <script>
    let input = document.getElementById('input');
    const terminal = document.getElementById('terminal');
    let history = [];
    let historyIndex = -1;

    input.focus();

    const commands = {
      'help': '可用指令: help, echo, clear, sudo rm -rf /, date, whoami',
      'echo': (args) => args.join(' '),
      'clear': () => {
        terminal.innerHTML = '<div><span class="command">$</span> <span id="input" contenteditable="true"></span><span class="blink">█</span></div>';
        bindInput();
        return null;
      },
      'date': () => new Date().toString(),
      'whoami': () => 'root',
      'sudo rm -rf /': 'DESTROY'
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const commandText = input.innerText.trim();
        if (!commandText) return;
        history.push(commandText);
        historyIndex = history.length;
        const output = document.createElement('div');
        output.innerHTML = `<span class="command">$</span> ${commandText}`;
        terminal.insertBefore(output, input.parentElement);
        input.innerText = '';

        executeCommand(commandText);
      } else if (e.key === 'ArrowUp') {
        if (historyIndex > 0) {
          historyIndex--;
          input.innerText = history[historyIndex];
        }
      } else if (e.key === 'ArrowDown') {
        if (historyIndex < history.length - 1) {
          historyIndex++;
          input.innerText = history[historyIndex];
        } else {
          input.innerText = '';
        }
      }
    });

    function bindInput() {
      input = document.getElementById('input');
      input.focus();
    }

    function executeCommand(text) {
      const [cmd, ...args] = text.split(' ');
      const full = text.toLowerCase();

      if (commands[full] === 'DESTROY') {
        simulateDestruction();
      } else if (typeof commands[cmd] === 'function') {
        const result = commands[cmd](args);
        if (result !== null) appendOutput(result, 'output');
      } else if (typeof commands[cmd] === 'string') {
        appendOutput(commands[cmd], 'output');
      } else {
        appendOutput(`command not found: ${cmd}`, 'error');
      }
    }

    function appendOutput(text, className = 'output') {
      const div = document.createElement('div');
      div.className = className;
      div.textContent = text;
      terminal.insertBefore(div, input.parentElement);
    }

    function simulateDestruction() {
      const messages = [
        '授權通過...',
        '正在刪除 /boot',
        '正在刪除 /etc',
        '正在刪除 /home',
        '正在刪除 /usr/bin',
        '正在刪除 /var/log',
        '系統核心崩潰中...',
        '系統即將終止...'
      ];

      let i = 0;
      input.parentElement.style.display = 'none';

      const interval = setInterval(() => {
        if (i >= messages.length) {
          clearInterval(interval);
          document.body.classList.add('destroying');
          terminal.innerHTML = '<div style="color:red">[系統已摧毀]</div>';
        } else {
          appendOutput(messages[i], 'info');
          i++;
        }
      }, 500);
    }
  </script>
</body>
</html>
