<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>動作遊戲 - HTML</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      background: #222;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 10;
      font-size: 18px;
    }
    .hp-bar {
      width: 200px;
      height: 20px;
      background: red;
      border: 2px solid #fff;
      margin-bottom: 10px;
    }
    .hp-bar-inner {
      height: 100%;
      background: lime;
      width: 100%;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div class="hp-bar"><div id="player-hp" class="hp-bar-inner"></div></div>
    分數: <span id="score">0</span>
  </div>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    class Entity {
      constructor(x, y, w, h, color) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.color = color;
        this.vx = 0;
        this.vy = 0;
        this.hp = 100;
        this.maxHp = 100;
        this.dead = false;
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.w, this.h);
      }
      intersect(other) {
        return (
          this.x < other.x + other.w &&
          this.x + this.w > other.x &&
          this.y < other.y + other.h &&
          this.y + this.h > other.y
        );
      }
    }

    class Player extends Entity {
      constructor() {
        super(100, 100, 40, 40, "yellow");
        this.speed = 5;
        this.dashing = false;
        this.invincible = 0;
        this.score = 0;
        this.autoFire = false;
        this.lastMelee = 0;
      }
      update() {
        if (this.invincible > 0) this.invincible--;
        this.x += this.vx;
        this.y += this.vy;
        this.x = Math.max(0, Math.min(canvas.width - this.w, this.x));
        this.y = Math.max(0, Math.min(canvas.height - this.h, this.y));
      }
    }

    class Enemy extends Entity {
      constructor(x, y) {
        super(x, y, 40, 40, "red");
        this.hp = 50;
        this.maxHp = 50;
      }
      update() {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const len = Math.hypot(dx, dy);
        this.vx = (dx / len) * 2;
        this.vy = (dy / len) * 2;
        this.x += this.vx;
        this.y += this.vy;
      }
    }

    class Bullet extends Entity {
      constructor(x, y, vx, vy) {
        super(x, y, 10, 10, "cyan");
        this.vx = vx;
        this.vy = vy;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
      }
    }

    let player = new Player();
    let enemies = [];
    let bullets = [];
    let effects = [];
    let keys = {};

    function spawnEnemy() {
      let x = Math.random() * canvas.width;
      let y = Math.random() * canvas.height;
      enemies.push(new Enemy(x, y));
    }

    function drawHPBar() {
      const hpPercent = player.hp / player.maxHp * 100;
      document.getElementById("player-hp").style.width = `${hpPercent}%`;
    }

    function drawScore() {
      document.getElementById("score").innerText = player.score;
    }

    function meleeAttack() {
      if (Date.now() - player.lastMelee < 500) return; // cooldown
      player.lastMelee = Date.now();
      let melee = new Entity(player.x - 10, player.y - 10, player.w + 20, player.h + 20, "rgba(255,255,0,0.3)");
      enemies.forEach(e => {
        if (!e.dead && melee.intersect(e)) {
          e.hp -= 40;
          if (e.hp <= 0) killEnemy(e);
        }
      });
    }

    function killEnemy(enemy) {
      enemy.dead = true;
      player.score += 10;
      effects.push({x: enemy.x, y: enemy.y, time: 20});
    }

    function drawEffects() {
      for (let i = effects.length - 1; i >= 0; i--) {
        const eff = effects[i];
        ctx.beginPath();
        ctx.arc(eff.x + 20, eff.y + 20, 30 - eff.time, 0, 2 * Math.PI);
        ctx.fillStyle = `rgba(255,255,0,${eff.time / 20})`;
        ctx.fill();
        eff.time--;
        if (eff.time <= 0) effects.splice(i, 1);
      }
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      player.update();
      enemies.forEach(e => e.update());
      bullets.forEach(b => b.update());

      if (player.autoFire && Date.now() % 5 === 0) {
        bullets.push(new Bullet(player.x + 15, player.y, 0, -10));
      }

      for (let e of enemies) {
        if (!e.dead && player.intersect(e) && player.invincible === 0) {
          player.hp -= 10;
          player.invincible = 30;
          if (player.hp <= 0) alert("你死了");
        }
        for (let b of bullets) {
          if (!e.dead && b.intersect(e)) {
            e.hp -= 25;
            b.x = -9999;
            if (e.hp <= 0) killEnemy(e);
          }
        }
      }

      player.draw();
      enemies.forEach(e => { if (!e.dead) e.draw(); });
      bullets.forEach(b => b.draw());
      drawEffects();
      drawHPBar();
      drawScore();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("keydown", e => {
      keys[e.key] = true;
      if (e.key === " ") bullets.push(new Bullet(player.x + 15, player.y, 0, -10));
      if (e.key === "Shift") {
        if (!player.dashing) {
          player.x += player.vx * 20;
          player.dashing = true;
          setTimeout(() => (player.dashing = false), 200);
        }
      }
      if (e.key === "y") player.autoFire = true;
      if (e.key === "z") meleeAttack();
    });
    window.addEventListener("keyup", e => {
      keys[e.key] = false;
      if (e.key === "y") player.autoFire = false;
    });

    function controlPlayer() {
      player.vx = player.vy = 0;
      if (keys["w"]) player.vy = -player.speed;
      if (keys["s"]) player.vy = player.speed;
      if (keys["a"]) player.vx = -player.speed;
      if (keys["d"]) player.vx = player.speed;
    }

    setInterval(controlPlayer, 20);
    setInterval(spawnEnemy, 1500);

    gameLoop();
  </script>
</body>
</html>
