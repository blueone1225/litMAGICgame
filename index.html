


<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>烤肉分組助手</title>
  <style>
    body { font-family: 微軟正黑體; background: #f1f8e9; color: #2e7d32; padding: 20px; }
    h1 { color: #1b5e20; }
    button { padding: 10px; margin: 10px 0; background: #81c784; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #66bb6a; }
    .group { margin: 10px 0; padding: 10px; border: 1px solid #a5d6a7; border-radius: 8px; background: #ffffffc0; }
  </style>
</head>
<body>

<h1>🍖 學生班--烤肉分組工具</h1>
<button onclick="generateGroups()">重新分組</button>

<div id="output"></div>

<script>
  const A = ["小明", "小美", "阿成", "小莉", "阿軒"]; // 熟
  const B = ["子瑋", "小安", "小柔", "阿民", "佩佩", "小恩"]; // 普通
  const C = ["阿賓", "志豪", "小婷", "雨潔"]; // 不熟

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function distributeEvenly(list, groups) {
    list.forEach((p, i) => groups[i % groups.length].push(p));
  }

  function generateGroups() {
    const groupCount = 3;
    const groups = Array.from({ length: groupCount }, () => []);
    shuffle(A); shuffle(B); shuffle(C);
    distributeEvenly(A, groups);
    distributeEvenly(B, groups);
    distributeEvenly(C, groups);

    const output = document.getElementById("output");
    output.innerHTML = '';
    groups.forEach((g, i) => {
      const div = document.createElement("div");
      div.className = "group";
      div.innerHTML = `<strong>第 ${i + 1} 組：</strong> ${g.join(", ")}`;
      output.appendChild(div);
    });
  }
</script>

</body>
</html>
