<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>學生性格分組系統</title>
  <style>
    body { font-family: 微軟正黑體; background: #f0fdf4; color: #1b5e20; padding: 20px; }
    h1 { color: #33691e; text-align: center; }
    .trait-box {
      border: 2px dashed #a5d6a7;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      background: #e8f5e9;
    }
    .trait-box h3 {
      margin-top: 0;
      text-align: center;
    }
    button {
      padding: 6px 12px;
      background-color: #66bb6a;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background-color: #4caf50;
    }
    .group {
      border: 1px solid #c8e6c9;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      background: #ffffffb0;
    }
    #result {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
    }
    .group div {
      width: 100%;
      margin: 10px 0;
    }
    .student-item {
      display: inline-block;
      margin: 3px 5px;
      background: #c8e6c9;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .delete-btn {
      background: transparent;
      color: red;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-left: 5px;
    }
    @media (min-width: 600px) {
      .group div { width: 45%; }
    }
    @media (min-width: 768px) {
      .group div { width: 30%; }
    }
    @media (min-width: 1024px) {
      .group div { width: 22%; }
    }
  </style>
</head>
<body>

<h1>🌳 學生性格分組系統</h1>
<button onclick="generateGroups()">開始分組</button>

<div class="trait-box">
  <h3>🧑‍🏫 可照顧別人</h3>
  <div id="careList"></div>
  <input type="text" id="careInput" placeholder="輸入名字">
  <button onclick="addName('care')">新增</button>
</div>

<div class="trait-box">
  <h3>🐢 內向型</h3>
  <div id="shyList"></div>
  <input type="text" id="shyInput" placeholder="輸入名字">
  <button onclick="addName('shy')">新增</button>
</div>

<div class="trait-box">
  <h3>🤝 中間值</h3>
  <div id="neutralList"></div>
  <input type="text" id="neutralInput" placeholder="輸入名字">
  <button onclick="addName('neutral')">新增</button>
</div>

<h2>📦 分組結果</h2>
<div id="result"></div>

<script>
  let care = ["小芸", "阿傑", "怡君"];
  let shy = ["子涵", "志偉", "靜儀", "冠宇"];
  let neutral = ["小瑜", "偉翔", "佩珊", "宏昌"];

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function distributeEvenly(list, groups) {
    list.forEach((person, i) => {
      groups[i % groups.length].push(person);
    });
  }

  function generateGroups() {
    shuffle(care);
    shuffle(shy);
    shuffle(neutral);

    const groupCount = 3;
    const groups = Array.from({ length: groupCount }, () => ({
      members: [],
      care: 0,
      shy: 0,
      neutral: 0
    }));

    distributeEvenly(care, groups.map(g => g.members));
    distributeEvenly(shy, groups.map(g => g.members));
    distributeEvenly(neutral, groups.map(g => g.members));

    // 計算每組中各類型人數
    groups.forEach(group => {
      group.care = group.members.filter(name => care.includes(name)).length;
      group.shy = group.members.filter(name => shy.includes(name)).length;
      group.neutral = group.members.filter(name => neutral.includes(name)).length;
    });

    const output = document.getElementById("result");
    output.innerHTML = '';
    groups.forEach((group, i) => {
      const div = document.createElement("div");
      div.className = "group";
      div.innerHTML = `
        <strong>第 ${i + 1} 組：</strong><br>
        成員：${group.members.join("、")}<br>
        👥 組成規則：🧑‍🏫 ${group.care} 位，🐢 ${group.shy} 位，🤝 ${group.neutral} 位
      `;
      output.appendChild(div);
    });
  }

  function addName(trait) {
    let input = document.getElementById(trait + "Input");
    let name = input.value.trim();
    if (!name) return;

    if (trait === "care") care.push(name);
    if (trait === "shy") shy.push(name);
    if (trait === "neutral") neutral.push(name);

    input.value = "";
    updateList(trait);
  }

  function deleteName(trait, name) {
    if (trait === "care") care = care.filter(n => n !== name);
    if (trait === "shy") shy = shy.filter(n => n !== name);
    if (trait === "neutral") neutral = neutral.filter(n => n !== name);

    updateList(trait);
  }

  function updateList(trait) {
    let container = document.getElementById(trait + "List");
    container.innerHTML = "";
    let list = trait === "care" ? care : trait === "shy" ? shy : neutral;

    list.forEach(name => {
      let span = document.createElement("span");
      span.className = "student-item";
      span.textContent = name;

      let del = document.createElement("button");
      del.textContent = "❌";
      del.className = "delete-btn";
      del.onclick = () => deleteName(trait, name);

      span.appendChild(del);
      container.appendChild(span);
    });
  }

  // 初始化畫面
  updateList("care");
  updateList("shy");
  updateList("neutral");
</script>

</body>
</html>
